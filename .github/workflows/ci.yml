name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: worn
          POSTGRES_PASSWORD: worn
          POSTGRES_DB: worn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worn -d worn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # BullMQ queues; redis:7's default maxmemory-policy is noeviction, which BullMQ needs.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build --filter=@worn/shared --filter=@worn/api --filter=@worn/worker-ingest --filter=@worn/worker-expiry --filter=@worn/worker-wardrobe --filter=@worn/worker-returns --filter=@worn/worker-gifts --filter=@worn/worker-nudge

      - name: Lint
        run: pnpm turbo run lint --filter=@worn/web --filter=@worn/shared --filter=@worn/db --filter=@worn/api --filter=@worn/mobile --filter=@worn/config --filter=@worn/worker-orders --filter=@worn/worker-render --filter=@worn/render-agent --filter=@worn/worker-ingest --filter=@worn/worker-expiry --filter=@worn/worker-wardrobe --filter=@worn/worker-returns --filter=@worn/worker-gifts --filter=@worn/worker-nudge

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=@worn/web --filter=@worn/shared --filter=@worn/db --filter=@worn/api --filter=@worn/mobile --filter=@worn/config --filter=@worn/worker-orders --filter=@worn/worker-render --filter=@worn/render-agent --filter=@worn/worker-ingest --filter=@worn/worker-expiry --filter=@worn/worker-wardrobe --filter=@worn/worker-returns --filter=@worn/worker-gifts --filter=@worn/worker-nudge

      # The marketing site (worncloset.app): a broken page or route fails the build here, not on deploy.
      - name: Build website
        run: pnpm --filter @worn/web build

      - name: Test
        run: pnpm turbo run test --filter=@worn/web --filter=@worn/shared --filter=@worn/db --filter=@worn/api --filter=@worn/mobile --filter=@worn/worker-orders --filter=@worn/worker-render --filter=@worn/render-agent --filter=@worn/worker-ingest --filter=@worn/worker-expiry --filter=@worn/worker-wardrobe --filter=@worn/worker-returns --filter=@worn/worker-gifts --filter=@worn/worker-nudge

      # The wall-clock budgets, alone on the runner (in the step above every package's tests share the
      # CPU). The budgets were set on a laptop; GitHub's shared runners are about three times slower.
      - name: Performance budgets (isolated)
        run: pnpm --filter @worn/shared test:perf
        env:
          PERF_BUDGET_SCALE: "3"

      # Outside turbo: its strict env mode would drop TEST_REDIS_URL, and these must not be cached.
      - name: Queue tests against Redis 7
        run: |
          pnpm --filter @worn/api exec vitest run src/lib/queues src/jobs
          pnpm --filter "./services/*" exec vitest run
        env:
          TEST_REDIS_URL: redis://localhost:6379

      - name: Apply database migrations
        run: pnpm --filter @worn/db db:migrate
        env:
          DATABASE_URL: postgresql://worn:worn@localhost:5432/worn

      # Every suite that reads DATABASE_URL (repositories, coin races, paid renders, the render
      # pipeline, the money ledger); without it they skip.
      - name: Postgres tests
        run: |
          # One file at a time: these suites share one database, and catalog tests that archive listings
          # can otherwise race another file's fixtures.
          pnpm --filter @worn/api exec vitest run --no-file-parallelism src/lib/repositories src/lib/render/pipeline.test.ts
          pnpm --filter @worn/db exec vitest run src/queries/money.test.ts
        env:
          DATABASE_URL: postgresql://worn:worn@localhost:5432/worn

      # The documented production start (node dist/index.js) against the migrated database: the
      # built output must resolve every workspace package and answer /health.
      - name: Built API boots
        working-directory: apps/api
        run: |
          node dist/index.js > api-boot.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4310/health; then break; fi
            if ! kill -0 $PID 2>/dev/null; then cat api-boot.log; exit 1; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4310/health || { cat api-boot.log; exit 1; }
          kill $PID
        env:
          PORT: "4310"
          DATABASE_URL: postgresql://worn:worn@localhost:5432/worn

      - name: Parser-accuracy threshold check (coverage ≥80%, grand-total ≥90%)
        run: pnpm --filter @worn/worker-ingest spike:check

      - name: EAS release gates (profiles + OTA docs; no store submit)
        run: node scripts/check-eas-gates.mjs

      - name: CASA / Limited Use track (docs + in-app; no Google/store submit)
        run: node scripts/check-casa-track.mjs

      - name: Store listings packet (copy + Data Safety + screenshots; no store submit)
        run: node scripts/check-store-listings.mjs

      - name: Ops playbooks (parser / refund / deletion + admin link)
        run: node scripts/check-ops-playbooks.mjs

      - name: DPDP + GDPR packet (privacy policy + checklist; no fake counsel sign)
        run: node scripts/check-dpdp-gdpr.mjs

      - name: Pentest readiness (threat model; no fake third-party report)
        run: node scripts/check-pentest-readiness.mjs

      # A release export needs packages/shared/dist (built above) and babel-preset-expo; this
      # catches either going missing, and any local URL left in the bundle.
      - name: Mobile release bundle (ios export, no local URLs)
        working-directory: apps/mobile
        run: |
          pnpm exec expo export --platform ios --no-bytecode --source-maps --output-dir dist-release
          pnpm run check:release-bundle dist-release
        env:
          EXPO_PUBLIC_API_URL: https://api.example.com
          WORN_RELEASE_BUILD: "1"
          EXPO_NO_TELEMETRY: "1"

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Every migration file is in the journal
        run: |
          FILES=$(ls packages/db/migrations/*.sql | wc -l)
          ENTRIES=$(node -p "require('./packages/db/migrations/meta/_journal.json').entries.length")
          if [ "$FILES" -ne "$ENTRIES" ]; then
            echo "::error::packages/db/migrations has $FILES SQL files but $ENTRIES journal entries"
            exit 1
          fi

      - name: drizzle-kit check
        run: pnpm --filter @worn/db exec drizzle-kit check

      - name: Check for schema drift
        run: |
          OUTPUT=$(pnpm --filter @worn/db db:generate 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qiE "No schema changes|nothing to migrate"; then
            echo "No pending schema changes."
          else
            echo "::error::Schema drift: run \`pnpm --filter @worn/db db:generate\` and commit the migration"
            exit 1
          fi

  # Fails on any critical advisory in a production dependency tree (the API, workers, and the
  # packages the apps ship). Dev and build tooling is out of scope here. Nothing is ignored: a
  # runtime critical is fixed (upgrade, or a pnpm.overrides entry documented in package.json),
  # never allowlisted.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: No critical advisories in production dependencies
        run: pnpm audit --prod --audit-level=critical
