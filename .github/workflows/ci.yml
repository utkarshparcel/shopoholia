name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: worn
          POSTGRES_PASSWORD: worn
          POSTGRES_DB: worn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worn -d worn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build --filter=@worn/shared --filter=@worn/api

      - name: Lint
        run: pnpm turbo run lint --filter=@worn/shared --filter=@worn/db --filter=@worn/api --filter=@worn/mobile --filter=@worn/config --filter=@worn/worker-orders --filter=@worn/worker-render

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=@worn/shared --filter=@worn/db --filter=@worn/api --filter=@worn/mobile --filter=@worn/config --filter=@worn/worker-orders --filter=@worn/worker-render

      - name: Test
        run: pnpm turbo run test --filter=@worn/shared --filter=@worn/db --filter=@worn/api --filter=@worn/mobile --filter=@worn/worker-orders --filter=@worn/worker-render

      - name: Apply database migrations
        run: pnpm --filter @worn/db db:migrate
        env:
          DATABASE_URL: postgresql://worn:worn@localhost:5432/worn

      - name: Postgres repository tests
        run: pnpm --filter @worn/api exec vitest run src/lib/repositories/postgres
        env:
          DATABASE_URL: postgresql://worn:worn@localhost:5432/worn
